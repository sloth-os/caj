# Build + e2e-test + publish the caj2pdf Docker image.
#
# The CNKI runtime is vendored (vendor/*.rpm) so every job is self-contained:
#   test        extracts the RPM on the runner, converts the fixture .caj in
#               all three modes and checks each PDF from scratch
#   docker-e2e  builds the image and re-runs the same e2e INSIDE the container
#   publish     pushes to ghcr.io only after docker-e2e passes, on main/tags
name: build-and-publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  test:
    name: e2e on runner (vendored CNKI runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (numpy, Pillow, rpm2cpio/cpio)
        run: |
          pip install --quiet 'numpy>=2' 'Pillow>=11'
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm2cpio cpio

      - name: Verify vendored runtime checksum
        run: |
          echo "f3730fad4d45873474c84dfbc8b2228a8b2a2e1ef0321e44005337190f88b5f3  vendor/cajviewer-1.0-1.el7.noarch.rpm" | sha256sum -c -

      - name: Extract CNKI runtime from vendored RPM
        run: |
          mkdir -p "$HOME/cnki" && cd "$HOME/cnki"
          rpm2cpio "$GITHUB_WORKSPACE"/vendor/cajviewer-*.rpm | cpio -idm --quiet
          test -f opt/cajviewer/usr/lib/libreaderex_x64.so

      - name: Run e2e against the fixture .caj
        run: |
          python3 tests/e2e_test.py \
            --lib "$HOME/cnki/opt/cajviewer/usr/lib/libreaderex_x64.so" \
            --resdir "$HOME/cnki/opt/cajviewer/usr/bin"

  docker-e2e:
    name: e2e inside the Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: caj2pdf:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run e2e inside the container
        run: |
          docker run --rm --entrypoint python3 caj2pdf:ci /app/tests/e2e_test.py

  publish:
    name: Publish image to ghcr.io
    runs-on: ubuntu-latest
    needs: [test, docker-e2e]
    # Never publish third-party binaries from a fork/PR run.
    if: github.event_name != 'pull_request'
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
